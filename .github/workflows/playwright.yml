name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Netlify Preview URL"
        required: true
        type: string

      pr_number:
        description: "Pull Request Number"
        required: true
        type: string

      sha:
        description: "Commit SHA"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ inputs.base_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Print Inputs
        run: |
          echo "PR Number : ${{ inputs.pr_number }}"
          echo "Commit SHA: ${{ inputs.sha }}"
          echo "Base URL  : $BASE_URL"